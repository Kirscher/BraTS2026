[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "brats-goat-2026"
version = "0.1.0"
description = "Minimal inference and evaluation code for BraTS-GoAT 2026 Task 3."
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
]

[project.optional-dependencies]
inference = [
  "nnunetv2==2.6.2",
  "nibabel==5.3.2",
  "numpy==1.26.4",
  "scipy==1.15.0",
  "dynamic-network-architectures==0.4.4",
  "acvl-utils==0.2.5",
  "batchgenerators==0.25.1",
  "batchgeneratorsv2==0.3.0",
  "blosc2==3.0.0",
  "SimpleITK==2.4.0",
  "scikit-image==0.25.0",
  "scikit-learn==1.6.0",
]
analysis = [
  "matplotlib>=3.9",
  "nibabel>=5.2",
  "pandas>=2.2",
  "scikit-learn>=1.6",
  "scipy>=1.15",
  "SimpleITK>=2.4",
  "statsmodels>=0.14",
  "surface-distance>=0.1",
  "tabulate>=0.9",
]
dev = [
  "nibabel>=5.2",
  "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]
