# BraTS 2026 Task 3 (GoAT) — Synthesis Stage-1 AutoencoderKL config.
# Resolves the 17 ``# SPECIALIST:`` hooks of AutoencoderKLConfig
# (src/brats2026/synthesis/autoencoder.py). Stage 1 of the DiffTumor synthesis
# track: a 3D AutoencoderKL that compresses -> reconstructs a volume and is FROZEN
# afterwards; Stages 2-3 (masks / latent diffusion) operate inside its latent space.
#
# From-scratch, GoAT-only data. Trained on ALL patches (healthy AND tumour-bearing,
# every cohort) because reconstruction is self-supervised and needs no labels. The
# patch is aligned to the nnU-Net plan patch, and every patch axis must be divisible
# by the latent factor 2**num_downsamplings. The expensive train-launch stays behind
# the human gate; this file only proposes. Every hook is null until the ai-specialist
# fills it against the inner-dev reports (never the outer LODO fold).
kind: synthesis-ae
provenance:
  git_sha: null
  # Fill from the data-pipeline ledger (provenance.fingerprint_from_ledger) of the
  # GoAT patch set BEFORE any real run. null = not yet certified; compliance-guard
  # must refuse a launch while this is null.
  dataset_fingerprint: null
  seed: 20260725          # date-derived, deterministic & traceable (matches `seed` hook below)
  parent_run_id: null     # run-id this config was derived from (null = fresh root)
  date: 2026-07-25
  config_schema_version: 1

# --- architecture -----------------------------------------------------------------
patch_size: null
# SPECIALIST: 3D patch size (D, H, W), plan-aligned to the nnU-Net patch AND divisible
# by the latent factor 2**num_downsamplings. Reference ~128^3 (memory permitting).

num_downsamplings: null
# SPECIALIST: number of encoder down-levels; the spatial latent factor is 2**n.
# Reference ~2-4 (factor 4-16). More levels = smaller latent, cheaper Stage-3 diffusion
# but lossier reconstruction.

latent_channels: null
# SPECIALIST: channel count of the latent tensor. Reference ~3-8. Wider latent =
# easier reconstruction, harder diffusion.

channels: null
# SPECIALIST: encoder feature widths per level (tuple, length = num_downsamplings+1),
# e.g. (64, 128, 256). Each width must be divisible by norm_num_groups.

num_res_blocks: null
# SPECIALIST: residual blocks per resolution level. Reference ~1-3.

attention_levels: null
# SPECIALIST: per-level self-attention flags (tuple of bool, parallel to `channels`).
# Reference: attention only at the deepest level(s), e.g. (false, false, true) — 3D
# attention at high resolution is memory-prohibitive.

norm_num_groups: null
# SPECIALIST: GroupNorm group count; each entry of `channels` must be divisible by it.
# Reference ~32 (or 8/16 for narrow early levels).

# --- loss weights -----------------------------------------------------------------
kl_weight: null
# SPECIALIST: weight of the KL(N(mu,sigma^2)||N(0,1)) regulariser. Reference ~1e-6:
# small, just enough to keep the latent near standard-normal for Stage-3 diffusion
# without over-smoothing the reconstruction.

perceptual_weight: null
# SPECIALIST: weight of the LPIPS perceptual loss. Reference ~0.5-1.0.

adversarial_weight: null
# SPECIALIST: weight of the patch-GAN adversarial loss. Reference ~0.1-0.5.

discriminator_start_epoch: null
# SPECIALIST: epoch at which the patch-GAN discriminator starts (the AE warms up first
# on L1+LPIPS+KL). Reference ~20-50.

# --- optimisation (offline budget) ------------------------------------------------
initial_lr: null
# SPECIALIST: autoencoder learning rate. Reference ~1e-4.

weight_decay: null
# SPECIALIST: autoencoder weight decay. Reference ~0 (AEs rarely need it).

warmup_epochs: null
# SPECIALIST: LR warm-up epochs.

num_epochs: null
# SPECIALIST: total AE training epochs (offline budget; NOT the 8h container budget).

batch_size: null
# SPECIALIST: watch training-GPU memory — 3D volumes at ~128^3 x 4 modalities are heavy.

seed: null
# SPECIALIST: RNG seed for reproducibility / provenance (mirrors provenance.seed).
# Date-derived so the whole Stage-1 run is reproducible from scratch.

# --- fixed data facts (NON-SPECIALIST; restated for the human reviewer) -----------
# spatial_dims=3 and in_channels=4 (t1n/t1c/t2f/t2w) are GoAT data facts baked into
# AutoencoderKLConfig as real defaults, NOT tunables — they are intentionally NOT
# listed here and must not be treated as hooks.
