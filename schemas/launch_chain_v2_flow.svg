<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="790" viewBox="0 0 1480 790" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 Z" fill="#3a3f4b"/>
    </marker>
    <filter id="soft" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.4" flood-color="#000000" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="1480" height="790" fill="#f7f8fa"/>

  <text x="40" y="42" font-size="26" font-weight="700" fill="#1c2230">nnUNetTrainerGoATv2 — artifact flow, left to right</text>
  <text x="40" y="66" font-size="14" fill="#5b6170">Style B · three lanes. What lands on disk (top) · the stage (middle) · the code that does it (bottom). The chain snaps at stage 4.</text>

  <!-- lane labels -->
  <text x="40" y="182" font-size="12" font-weight="700" fill="#8a90a0">ARTIFACT</text>
  <text x="40" y="198" font-size="12" font-weight="700" fill="#8a90a0">ON DISK</text>
  <text x="40" y="348" font-size="12" font-weight="700" fill="#8a90a0">STAGE</text>
  <text x="40" y="505" font-size="12" font-weight="700" fill="#8a90a0">CODE THAT</text>
  <text x="40" y="521" font-size="12" font-weight="700" fill="#8a90a0">DOES IT</text>

  <!-- break marker -->
  <line x1="945" y1="105" x2="945" y2="600" stroke="#c23a22" stroke-width="2" stroke-dasharray="6 5"/>
  <rect x="848" y="612" width="196" height="26" rx="6" fill="#fbe6e2" stroke="#c23a22"/>
  <text x="866" y="630" font-size="12" font-weight="700" fill="#c23a22">CHAIN SNAPS HERE</text>

  <!-- vertical connectors artifact <-> stage <-> code -->
  <g stroke="#c7ccd6" stroke-width="1.6">
    <line x1="320" y1="250" x2="320" y2="300"/><line x1="320" y1="390" x2="320" y2="440"/>
    <line x1="570" y1="250" x2="570" y2="300"/><line x1="570" y1="390" x2="570" y2="440"/>
    <line x1="820" y1="250" x2="820" y2="300"/><line x1="820" y1="390" x2="820" y2="440"/>
    <line x1="1070" y1="250" x2="1070" y2="300"/><line x1="1070" y1="390" x2="1070" y2="440"/>
    <line x1="1320" y1="250" x2="1320" y2="300"/><line x1="1320" y1="390" x2="1320" y2="440"/>
  </g>

  <!-- spine arrows -->
  <g stroke="#3a3f4b" stroke-width="2.4" marker-end="url(#arrow)">
    <line x1="437" y1="345" x2="451" y2="345"/>
    <line x1="687" y1="345" x2="701" y2="345"/>
    <line x1="937" y1="345" x2="951" y2="345"/>
    <line x1="1187" y1="345" x2="1201" y2="345"/>
  </g>

  <!-- ============== COLUMN 1 ============== -->
  <g filter="url(#soft)">
    <rect x="205" y="120" width="230" height="130" rx="8" fill="#e8f3ee" stroke="#2e7d57"/>
    <rect x="205" y="300" width="230" height="90" rx="8" fill="#e7eefc" stroke="#3f6fd1"/>
    <rect x="205" y="440" width="230" height="140" rx="8" fill="#e8f3ee" stroke="#2e7d57"/>
  </g>
  <text x="221" y="144" font-size="12" font-weight="700" fill="#1c2230">nnUNet_raw/</text>
  <text x="221" y="162" font-size="10.5" fill="#5b6170">Dataset501_BraTSGoAT</text>
  <text x="221" y="184" font-size="12" font-weight="700" fill="#1c2230">splits_final.json</text>
  <text x="221" y="202" font-size="10.5" fill="#5b6170">domain-balanced K-fold</text>
  <text x="221" y="224" font-size="12" font-weight="700" fill="#1c2230">nnUNetResEncUNetLPlans</text>
  <text x="221" y="242" font-size="10.5" fill="#5b6170">3d_fullres preprocessed</text>
  <text x="221" y="330" font-size="15" font-weight="700" fill="#1c2230">1 · PREPARE DATA</text>
  <text x="221" y="352" font-size="11" fill="#5b6170">shared with v1 — nothing</text>
  <text x="221" y="368" font-size="11" fill="#5b6170">v2-specific needed here</text>
  <text x="221" y="466" font-size="12" font-weight="700" fill="#1c2230">nnunet/convert.py</text>
  <text x="221" y="484" font-size="10.5" fill="#5b6170">labels NCR=1 ED=2 ET=3</text>
  <text x="221" y="508" font-size="12" font-weight="700" fill="#1c2230">nnunet/splits.py</text>
  <text x="221" y="526" font-size="10.5" fill="#8a90a0">cohorts read UNK today</text>
  <text x="221" y="550" font-size="12" font-weight="700" fill="#1c2230">nnunet/plan.py</text>
  <text x="221" y="568" font-size="10.5" fill="#5b6170">-pl nnUNetPlannerResEncL</text>

  <!-- ============== COLUMN 2 ============== -->
  <g filter="url(#soft)">
    <rect x="455" y="120" width="230" height="130" rx="8" fill="#f0eef9" stroke="#6a5acd" stroke-dasharray="5 4"/>
    <rect x="455" y="300" width="230" height="90" rx="8" fill="#e7eefc" stroke="#3f6fd1"/>
    <rect x="455" y="440" width="230" height="140" rx="8" fill="#e8f3ee" stroke="#2e7d57"/>
  </g>
  <text x="471" y="144" font-size="12" font-weight="700" fill="#1c2230">configs/train_v2.yaml</text>
  <text x="471" y="164" font-size="11" font-weight="700" fill="#6a5acd">DOES NOT EXIST</text>
  <text x="471" y="188" font-size="10.5" fill="#5b6170">the specialist has nothing</text>
  <text x="471" y="204" font-size="10.5" fill="#5b6170">to fill in — no template was</text>
  <text x="471" y="220" font-size="10.5" fill="#5b6170">ever written out, although</text>
  <text x="471" y="236" font-size="10.5" fill="#5b6170">make_template() supports it</text>
  <text x="471" y="330" font-size="15" font-weight="700" fill="#1c2230">2 · CONFIGURE</text>
  <text x="471" y="352" font-size="11" fill="#5b6170">18 SPECIALIST hooks +</text>
  <text x="471" y="368" font-size="11" fill="#5b6170">2 warm-start choices</text>
  <text x="471" y="466" font-size="12" font-weight="700" fill="#1c2230">config.py</text>
  <text x="471" y="484" font-size="10.5" fill="#5b6170">TRAIN_V2_HOOK_KEYS, line 57</text>
  <text x="471" y="508" font-size="12" font-weight="700" fill="#1c2230">load_goat_v2_config()</text>
  <text x="471" y="526" font-size="10.5" fill="#5b6170">assert_valid_config(train_v2)</text>
  <text x="471" y="550" font-size="12" font-weight="700" fill="#1c2230">config_from_mapping()</text>
  <text x="471" y="568" font-size="10.5" fill="#5b6170">YAML lists → tuples</text>

  <!-- ============== COLUMN 3 ============== -->
  <g filter="url(#soft)">
    <rect x="705" y="120" width="230" height="130" rx="8" fill="#fbece0" stroke="#b3541e" stroke-dasharray="5 4"/>
    <rect x="705" y="300" width="230" height="90" rx="8" fill="#e7eefc" stroke="#3f6fd1"/>
    <rect x="705" y="440" width="230" height="140" rx="8" fill="#fbece0" stroke="#b3541e" stroke-dasharray="5 4"/>
  </g>
  <text x="721" y="144" font-size="12" font-weight="700" fill="#1c2230">nnunetv2/training/</text>
  <text x="721" y="162" font-size="12" font-weight="700" fill="#1c2230">nnUNetTrainer/variants/</text>
  <text x="721" y="180" font-size="12" font-weight="700" fill="#1c2230">brats2026_goat_v2.py</text>
  <text x="721" y="204" font-size="10.5" fill="#5b6170">a 2-line import shim so</text>
  <text x="721" y="220" font-size="10.5" fill="#5b6170">-tr resolves by name</text>
  <text x="721" y="240" font-size="10.5" font-weight="700" fill="#b3541e">it imports a missing class</text>
  <text x="721" y="330" font-size="15" font-weight="700" fill="#1c2230">3 · REGISTER</text>
  <text x="721" y="352" font-size="11" fill="#5b6170">nnU-Net only scans its</text>
  <text x="721" y="368" font-size="11" fill="#5b6170">own package tree</text>
  <text x="721" y="466" font-size="12" font-weight="700" fill="#1c2230">install_goat_trainer_v2()</text>
  <text x="721" y="484" font-size="10.5" fill="#5b6170">trainer_v2.py:275 — written</text>
  <text x="721" y="508" font-size="12" font-weight="700" fill="#1c2230">CLI install-trainer-v2</text>
  <text x="721" y="526" font-size="10.5" fill="#5b6170">absent — cli.py has only the</text>
  <text x="721" y="542" font-size="10.5" fill="#5b6170">v1 command at line 242, so</text>
  <text x="721" y="558" font-size="10.5" fill="#5b6170">the installer is unreachable</text>

  <!-- ============== COLUMN 4 ============== -->
  <g filter="url(#soft)">
    <rect x="955" y="120" width="230" height="130" rx="8" fill="#fbe6e2" stroke="#c23a22" stroke-dasharray="5 4"/>
    <rect x="955" y="300" width="230" height="90" rx="8" fill="#fbe6e2" stroke="#c23a22" stroke-dasharray="5 4"/>
    <rect x="955" y="440" width="230" height="140" rx="8" fill="#fbe6e2" stroke="#c23a22" stroke-dasharray="5 4"/>
  </g>
  <text x="971" y="144" font-size="12" font-weight="700" fill="#1c2230">nnUNetv2_train</text>
  <text x="971" y="162" font-size="10.5" fill="#5b6170">501  3d_fullres  N</text>
  <text x="971" y="180" font-size="10.5" fill="#5b6170">-tr nnUNetTrainerGoATv2</text>
  <text x="971" y="198" font-size="10.5" fill="#5b6170">-p nnUNetResEncUNetLPlans</text>
  <text x="971" y="222" font-size="10.5" fill="#5b6170">env BRATS_GOAT_V2_</text>
  <text x="971" y="238" font-size="10.5" fill="#5b6170">TRAIN_CONFIG points at (2)</text>
  <text x="971" y="330" font-size="15" font-weight="700" fill="#1c2230">4 · TRAIN</text>
  <text x="971" y="352" font-size="11" font-weight="700" fill="#c23a22">nothing can run: the class</text>
  <text x="971" y="368" font-size="11" font-weight="700" fill="#c23a22">itself was never defined</text>
  <text x="971" y="466" font-size="12" font-weight="700" fill="#1c2230">class nnUNetTrainerGoATv2</text>
  <text x="971" y="484" font-size="10.5" fill="#5b6170">absent — file ends line 289</text>
  <text x="971" y="508" font-size="12" font-weight="700" fill="#1c2230">get_training_transforms()</text>
  <text x="971" y="526" font-size="10.5" fill="#5b6170">10 da_* hooks unconsumed</text>
  <text x="971" y="550" font-size="12" font-weight="700" fill="#1c2230">bias_field_multiplier()</text>
  <text x="971" y="568" font-size="10.5" fill="#5b6170">missing → 32 tests won't load</text>

  <!-- ============== COLUMN 5 ============== -->
  <g filter="url(#soft)">
    <rect x="1205" y="120" width="230" height="130" rx="8" fill="#f0eef9" stroke="#6a5acd" stroke-dasharray="5 4"/>
    <rect x="1205" y="300" width="230" height="90" rx="8" fill="#e7eefc" stroke="#3f6fd1"/>
    <rect x="1205" y="440" width="230" height="140" rx="8" fill="#e8f3ee" stroke="#2e7d57"/>
  </g>
  <text x="1221" y="144" font-size="12" font-weight="700" fill="#1c2230">nnUNet_results/</text>
  <text x="1221" y="162" font-size="10.5" fill="#5b6170">Dataset501_BraTSGoAT/</text>
  <text x="1221" y="180" font-size="10.5" fill="#5b6170">nnUNetTrainerGoATv2__</text>
  <text x="1221" y="196" font-size="10.5" fill="#5b6170">nnUNetResEncUNetLPlans__</text>
  <text x="1221" y="212" font-size="10.5" fill="#5b6170">3d_fullres/fold_N/</text>
  <text x="1221" y="236" font-size="10.5" fill="#5b6170">checkpoint_final.pth</text>
  <text x="1221" y="330" font-size="15" font-weight="700" fill="#1c2230">5 · RESULTS</text>
  <text x="1221" y="352" font-size="11" fill="#5b6170">distinct class name = no</text>
  <text x="1221" y="368" font-size="11" fill="#5b6170">collision with live v1 folds</text>
  <text x="1221" y="466" font-size="12" font-weight="700" fill="#1c2230">plan_weight_transfer()</text>
  <text x="1221" y="484" font-size="10.5" fill="#5b6170">a v1 checkpoint can seed v2</text>
  <text x="1221" y="508" font-size="12" font-weight="700" fill="#1c2230">assert_transferable()</text>
  <text x="1221" y="526" font-size="10.5" fill="#5b6170">refuses a wrong checkpoint</text>
  <text x="1221" y="550" font-size="12" font-weight="700" fill="#1c2230">→ configs/infer.yaml</text>
  <text x="1221" y="568" font-size="10.5" fill="#5b6170">as an ensemble member</text>

  <!-- ============== LEGEND ============== -->
  <rect x="205" y="672" width="22" height="16" rx="4" fill="#e8f3ee" stroke="#2e7d57"/>
  <text x="235" y="685" font-size="12" fill="#5b6170">built &amp; tested</text>
  <rect x="420" y="672" width="22" height="16" rx="4" fill="#e7eefc" stroke="#3f6fd1"/>
  <text x="450" y="685" font-size="12" fill="#5b6170">stage marker</text>
  <rect x="620" y="672" width="22" height="16" rx="4" fill="#fbece0" stroke="#b3541e" stroke-dasharray="5 4"/>
  <text x="650" y="685" font-size="12" fill="#5b6170">exists, not wired up</text>
  <rect x="870" y="672" width="22" height="16" rx="4" fill="#f0eef9" stroke="#6a5acd" stroke-dasharray="5 4"/>
  <text x="900" y="685" font-size="12" fill="#5b6170">planned / never written</text>
  <rect x="1140" y="672" width="22" height="16" rx="4" fill="#fbe6e2" stroke="#c23a22" stroke-dasharray="5 4"/>
  <text x="1170" y="685" font-size="12" fill="#5b6170">blocked — breaks the chain</text>

  <text x="205" y="730" font-size="11" fill="#8a90a0">Read left to right: stages 1–3 produce artifacts that exist or could exist today; stage 4 has no executable code behind it, so stage 5 is unreachable.</text>
  <text x="205" y="748" font-size="11" fill="#8a90a0">Grounded in trainer_v2.py, test_trainer_v2.py, config.py, plan.py, cli.py — read 2026-07-28.</text>
</svg>
