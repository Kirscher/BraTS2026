  <text class="body" x="858" y="297">per-cohort and LODO protocol implemented.</text>
  <text class="body" x="858" y="314" fill="#A32218">✗ LODO estimate never computed once.</text>
  <text class="body" x="858" y="338" fill="#8A5A00">⚠ NSD tolerance 1.0 mm vs BraTS 0.5 mm.</text>

