  <line x1="800" y1="490" x2="837" y2="490" stroke="#657880" stroke-width="1.6" marker-end="url(#ar)"/>
  <path d="M1200 285 L1222 285 L1222 388 L20 388 L20 490 L37 490" fill="none" stroke="#657880" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#ar)"/>

