  <rect class="panel" x="40" y="628" width="1160" height="182" rx="3"/>

  <circle cx="70" cy="662" r="12" fill="#A32218"/><text class="chip" x="66" y="666" fill="#FFFFFF">1</text>
  <text class="body" x="94" y="659" font-weight="700">Stage trained weights into docker/weights/</text>
  <text class="body" x="94" y="676" fill="#657880">Needs HPC access. Unblocks the container build, and the training log yields the missing hyperparameters.</text>

  <circle cx="70" cy="706" r="12" fill="#A32218"/><text class="chip" x="66" y="710" fill="#FFFFFF">2</text>
  <text class="body" x="94" y="703" font-weight="700">Recover submission-1 hyperparameters from fold_N/training_log_*.txt and plans.json</text>
  <text class="body" x="94" y="720" fill="#657880">Unblocks the paper's Methods section, which cannot be written without them.</text>

  <circle cx="70" cy="750" r="12" fill="#8A5A00"/><text class="chip" x="66" y="754" fill="#FFFFFF">3</text>
  <text class="body" x="94" y="747" font-weight="700">Build the container on Linux + GPU and time it against the 8 h budget</text>
  <text class="body" x="94" y="764" fill="#657880">Verify: --network none, flat /output, geometry atol=0, nothing written to /input.</text>

  <circle cx="70" cy="792" r="12" fill="#8A5A00"/><text class="chip" x="66" y="796" fill="#FFFFFF">4</text>
  <text class="body" x="94" y="789" font-weight="700">Resolve the paper TODOs, commit and push the branch, submit all three artefacts</text>

