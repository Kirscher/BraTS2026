  <text class="body" x="58" y="297">region-based dataset.json (WT/TC/ET), symlinked</text>
  <text class="body" x="58" y="314">so NAS geometry is preserved bit-for-bit.</text>
  <text class="body" x="58" y="338" fill="#8A5A00">⚠ Exists on the HPC only — no work/ tree here.</text>

